# Builds the one-file AlphaNest app on Windows, macOS and Linux (PyInstaller
# can't cross-compile, so each OS builds its own). Run it from the Actions
# tab ("Run workflow"), or push a tag like v1.0 to also attach the three
# downloads to a GitHub Release.
name: Build app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AlphaNest-Windows
          - os: macos-latest
            artifact: AlphaNest-macOS
          - os: ubuntu-22.04   # oldest glibc we build on = widest Linux compatibility
            artifact: AlphaNest-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt's X11 libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1
      - run: pip install -r requirements.txt -r packaging/requirements-build.txt
      - run: python packaging/build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/AlphaNest.exe -DestinationPath ${{ matrix.artifact }}.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/AlphaNest.app ${{ matrix.artifact }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip ../${{ matrix.artifact }}.zip AlphaNest

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
